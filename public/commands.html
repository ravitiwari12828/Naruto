    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #111215;
      --bg-card-hover: #17181d;
      --border-color: #22242a;
      --border-highlight: #ff3b5c;
      --primary-red: #ff2a4b;
      --primary-red-glow: rgba(255, 42, 75, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --badge-bg: #1c1e24;
      --badge-perm-bg: rgba(255, 42, 75, 0.12);
      --badge-perm-text: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 75, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(126, 8, 8, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Glassmorphism Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(10, 10, 12, 0.85);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .brand-icon {
      font-size: 1.5rem;
      filter: drop-shadow(0 0 8px var(--primary-red-glow));
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary-red);
    }

    .btn-invite {
      background: linear-gradient(135deg, #ff2a4b 0%, #b80927 100%);
      color: #fff;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 15px var(--primary-red-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-invite:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 42, 75, 0.5);
    }

    /* Container */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      width: 100%;
      flex: 1;
    }

    /* Header & Search */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin-bottom: 2rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.25rem 1rem 3rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary-red);
      box-shadow: 0 0 20px var(--primary-red-glow);
    }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Category Filter Tabs Carousel */
    .categories-carousel {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .cat-btn:hover {
      border-color: rgba(255, 42, 75, 0.4);
      color: var(--text-main);
      background: var(--bg-card-hover);
    }

    .cat-btn.active {
      background: var(--primary-red);
      border-color: var(--primary-red);
      color: #fff;
      box-shadow: 0 4px 15px var(--primary-red-glow);

      background: rgba(0,0,0,0.25);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Commands Grid */
    .commands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    /* Bleed-Style Command Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 42, 75, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      background: var(--bg-card-hover);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .cmd-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
      border-radius: 0.35rem;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .copy-btn:hover {
      color: var(--primary-red);
      background: rgba(255, 42, 75, 0.1);
    }

    .cmd-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.45;
      min-height: 2.7em;
    }

    .meta-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .meta-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .meta-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-main);
      background: var(--badge-bg);
      padding: 0.35rem 0.65rem;
      border-radius: 0.5rem;
      display: inline-block;
      width: fit-content;
      word-break: break-all;
    }

    .perm-badge {
      background: var(--badge-perm-bg);
      color: var(--badge-perm-text);
      font-weight: 600;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.4rem;
      display: inline-block;
      width: fit-content;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--primary-red);
      color: #fff;
      padding: 0.85rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      box-shadow: 0 8px 25px var(--primary-red-glow);
      transform: translateY(150%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
    }

    /* Empty state */

      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

      { id: 'music', name: '🎶 Music Suite', count: COMMANDS.filter(c => c.cat === 'music').length },
      { id: 'economy', name: '🪙 Economy & Casino', count: COMMANDS.filter(c => c.cat === 'economy').length },
      { id: 'rpg', name: '🍥 Naruto RPG', count: COMMANDS.filter(c => c.cat === 'rpg').length },
      { id: 'tickets', name: '🎟️ Support Tickets', count: COMMANDS.filter(c => c.cat === 'tickets').length },
      { id: 'voice', name: '🔊 VoiceMaster', count: COMMANDS.filter(c => c.cat === 'voice').length },
      { id: 'profile', name: '👤 Profile & Avatars', count: COMMANDS.filter(c => c.cat === 'profile').length },
      { id: 'info', name: '📈 Utility & Info', count: COMMANDS.filter(c => c.cat === 'info').length },
      { id: 'fun', name: '🎉 Fun & Games', count: COMMANDS.filter(c => c.cat === 'fun').length },
      { id: 'level', name: '⭐ Levels & Ranks', count: COMMANDS.filter(c => c.cat === 'level').length },
      { id: 'giveaway', name: '🎁 Giveaways', count: COMMANDS.filter(c => c.cat === 'giveaway').length },
      { id: 'reactionrole', name: '🎭 Reaction Roles', count: COMMANDS.filter(c => c.cat === 'reactionrole').length },
      { id: 'welcome', name: '👋 Welcome', count: COMMANDS.filter(c => c.cat === 'welcome').length },
      { id: 'backup', name: '💾 Server Backup', count: COMMANDS.filter(c => c.cat === 'backup').length }
    ];

    let currentCategory = 'all';
    let searchQuery = '';

    const categoriesTabs = document.getElementById('categoriesTabs');
    const commandsGrid = document.getElementById('commandsGrid');
    const searchInput = document.getElementById('searchInput');
    const toast = document.getElementById('toast');

    function renderCategories() {
      categoriesTabs.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          <span>${cat.name}</span>
          <span class="cat-count">${cat.count}</span>
        </button>
      `).join('');
    }

    function selectCategory(catId) {
      currentCategory = catId;
      renderCategories();
      renderCommands();
    }

    function renderCommands() {
      const filtered = COMMANDS.filter(cmd => {
        const matchesCat = currentCategory === 'all' || cmd.cat === currentCategory;
        const matchesSearch = searchQuery === '' || 
          cmd.name.toLowerCase().includes(searchQuery) || 
          cmd.desc.toLowerCase().includes(searchQuery) ||
          cmd.args.toLowerCase().includes(searchQuery) ||
          cmd.perms.some(p => p.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        commandsGrid.innerHTML = `<div class="empty-state">No commands found matching "${searchQuery}".</div>`;
        return;
      }

      commandsGrid.innerHTML = filtered.map(cmd => `
        <div class="card">
          <div class="card-header">
            <span class="cmd-name">${cmd.name}</span>
            <button class="copy-btn" title="Copy command" onclick="copyCommand('${cmd.name}')">📋</button>
          </div>
          <p class="cmd-desc">${cmd.desc}</p>
          
          <div class="meta-group">
            <span class="meta-label">arguments</span>
            <span class="meta-value">${cmd.args}</span>
          </div>

          <div class="meta-group">
            <span class="meta-label">permissions</span>
            <div>
              ${cmd.perms.map(p => `<span class="perm-badge">${p}</span>`).join(' ')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function copyCommand(text) {
      navigator.clipboard.writeText(text);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderCommands();
    });

    // Initial render
    renderCategories();
    renderCommands();
  </script>
</body>
</html>
